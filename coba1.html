<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        table {
            width: 70%;
            margin: 100px auto;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        th {
            background: #222;
            color: white;
            padding: 20px;
        }

        td {
            background: white;
            color: #333;
            padding: 25px;
            text-align: center;
            font-size: 20px;
        }

        tr:hover td {
            background: #f1f1f1;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th>SELAMAT DATANG</th>
    </tr>

    <tr>
        <td>M HAFIDZ AL HAQIQI</td>
    </tr>
</table>

</body>
</html>
